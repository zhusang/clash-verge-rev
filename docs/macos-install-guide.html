<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DinoVPN · macOS 安装引导</title>
<style>
  :root {
    --desk: #e7ebf2;
    --desk-line: #d5dbe6;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --blue: #007aff;
    --blue-deep: #0058c6;
    --card: #ffffff;
    --hair: rgba(0, 0, 0, 0.08);
    --shadow: 0 18px 40px rgba(28, 39, 68, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: #cfd5e0;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
  }

  /* 1320 × 760, the size of a DMG window plus a caption strip */
  .board {
    width: 1320px;
    height: 760px;
    background:
      radial-gradient(1200px 420px at 50% -10%, #ffffff 0%, transparent 60%),
      linear-gradient(180deg, #f4f6fa 0%, var(--desk) 100%);
    padding: 36px 48px 28px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .board::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--desk-line) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.55;
    pointer-events: none;
  }

  header, .steps, footer { position: relative; z-index: 1; }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .mark {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(160deg, #3aa0ff, var(--blue-deep));
    box-shadow: 0 6px 14px rgba(0, 122, 255, 0.35);
    display: grid;
    place-items: center;
    flex: none;
  }

  .titles h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -0.4px;
  }

  .titles p {
    margin: 2px 0 0;
    font-size: 15px;
    color: var(--muted);
  }

  .steps {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 36px 1fr 36px 1fr;
    align-items: center;
    margin-top: 8px;
  }

  .arrow {
    display: grid;
    place-items: center;
    color: #b7bfcc;
  }

  .step { display: flex; flex-direction: column; align-items: center; gap: 16px; }

  .stage {
    width: 360px;
    height: 430px;
    background: var(--card);
    border-radius: 22px;
    box-shadow: var(--shadow);
    border: 1px solid var(--hair);
    position: relative;
    overflow: hidden;
  }

  .chrome {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    background: linear-gradient(#fbfbfd, #f2f3f6);
    border-bottom: 1px solid var(--hair);
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }

  .chrome .name {
    margin-left: 8px;
    font-size: 12px;
    color: #8a8a8e;
    font-weight: 500;
  }

  .caption { text-align: center; width: 360px; }
  .caption .n {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--blue);
    margin-bottom: 4px;
  }
  .caption h2 { margin: 0; font-size: 20px; font-weight: 650; }
  .caption p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); }

  /* ---- stage 1: Finder ---- */
  .finder { height: calc(100% - 38px); display: flex; flex-direction: column; padding: 22px 26px; }
  .dmg {
    align-self: center;
    width: 168px;
    height: 196px;
    margin-top: 18px;
    border-radius: 18px;
    background: linear-gradient(180deg, #f7f9fc, #eef1f6);
    border: 1px solid var(--hair);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
  }
  .dmg .disc {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, transparent 16px, #d7dde7 17px 22px, transparent 23px),
      conic-gradient(from 210deg, #c5ccd8, #ffffff, #b7c0ce, #ffffff, #c5ccd8);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06), 0 8px 16px rgba(28,39,68,0.12);
  }
  .dmg .disc::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #fff;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    left: 50%;
    top: 74px;
    transform: translateX(-50%);
  }
  .dmg span { font-size: 13px; font-weight: 600; color: #3a3a3c; }
  .cursor {
    position: absolute;
    right: 18px;
    bottom: 62px;
    filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.25));
  }

  /* ---- stage 2: the app icon being double-clicked ---- */
  .volume { height: calc(100% - 38px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .appicon { position: relative; }
  .appicon .glow {
    position: absolute;
    inset: -14px;
    border-radius: 34px;
    background: radial-gradient(circle, rgba(0,122,255,0.28), transparent 70%);
  }
  .click-ring {
    position: absolute;
    inset: -8px;
    border-radius: 30px;
    border: 2px solid var(--blue);
    opacity: 0.85;
  }
  .click-ring.outer { inset: -18px; border-radius: 38px; opacity: 0.35; }
  .badge {
    position: absolute;
    top: -10px;
    right: -16px;
    background: var(--blue);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    padding: 4px 8px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,122,255,0.4);
  }
  .appname { font-size: 14px; font-weight: 600; }

  /* ---- stage 3: Gatekeeper dialog ---- */
  .dialog-wrap { height: calc(100% - 38px); display: grid; place-items: center; background: linear-gradient(#f6f7fa, #eef0f4); }
  .dialog {
    width: 300px;
    background: rgba(246, 246, 248, 0.96);
    border-radius: 14px;
    box-shadow: 0 24px 50px rgba(0,0,0,0.28), 0 0 0 1px rgba(0,0,0,0.12);
    overflow: hidden;
    text-align: center;
  }
  .dialog .body { padding: 22px 22px 8px; }
  .dialog h3 { margin: 12px 0 6px; font-size: 15px; font-weight: 700; }
  .dialog p { margin: 0; font-size: 12px; line-height: 1.5; color: #3a3a3c; }
  .dialog .btns { display: flex; border-top: 1px solid rgba(0,0,0,0.12); margin-top: 16px; }
  .dialog button {
    flex: 1;
    height: 40px;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    color: var(--blue);
    cursor: default;
  }
  .dialog button + button { border-left: 1px solid rgba(0,0,0,0.12); }
  .dialog button.go {
    font-weight: 700;
    color: #fff;
    background: var(--blue);
    border-radius: 0 0 13px 0;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    padding-top: 6px;
  }
  footer b { color: var(--ink); font-weight: 650; }
</style>
</head>
<body>
  <div class="board">
    <header>
      <div class="mark">
        <svg width="28" height="28" viewBox="0 0 512 512">
          <path fill="#fff" d="M66.8 243.3C64.4 202.6 63.5 161 66.1 119.9q.9-14.4 3.4-29c1.8-10.5 4.7-23.7 11.6-31.2 7.7-8.5 21.2-.3 28.3 4.8q13.2 9.3 28.1 23.8 16.6 16.1 32.8 31.9 7 6.9 15.4 13.5c3.8 3 9 6.8 14 5.4q56.3-16.1 112.8.1c4.5 1.3 9.8-2.3 13.7-5.4q8.4-6.6 15.6-13.7 16.6-16.1 32-31.1 15.8-15.3 30.1-25.3 5.9-4.1 12.7-6.5c13.5-4.8 19 7.4 22.1 17.6q4.1 13.5 5.8 29.9 3.1 29.3 3.1 64.3-.1 36.6-2.4 74.6l.2 1q13.9 26.9 21.1 57.5c2.4 10.3-.9 22.1-5.5 31.7-11.4 24-30.9 45.2-51.4 62.3q-36.9 30.8-80 46.9-63.5 23.7-127.8 6.3c-39.3-10.7-76.2-32.2-106.5-59.4-17.8-16-34.7-35.3-44.7-57-4.3-9.3-7.5-20.8-5.2-30.6q7.2-30.8 21.1-57.7z"/>
        </svg>
      </div>
      <div class="titles">
        <h1>在 Mac 上安装 DinoVPN</h1>
        <p>不用拖拽。双击一次，应用会自己装进「应用程序」。</p>
      </div>
    </header>

    <div class="steps">
      <!-- 1 -->
      <div class="step">
        <div class="stage">
          <div class="chrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="name">下载</span></div>
          <div class="finder">
            <div class="dmg">
              <div class="disc"></div>
              <span>DinoVPN.dmg</span>
              <svg class="cursor" width="22" height="26" viewBox="0 0 22 26">
                <path d="M1 1l6.2 20.4 3.2-7.2 7.6 1.2z" fill="#fff" stroke="#1d1d1f" stroke-width="1.4" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="caption">
          <span class="n">01</span>
          <h2>打开安装包</h2>
          <p>双击下载好的 DinoVPN.dmg，<br/>磁盘映像会自动挂载。</p>
        </div>
      </div>

      <div class="arrow">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M6 14h15M15 8l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <!-- 2 -->
      <div class="step">
        <div class="stage">
          <div class="chrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="name">DinoVPN</span></div>
          <div class="volume">
            <div class="appicon">
              <div class="glow"></div>
              <span class="click-ring outer"></span>
              <span class="click-ring"></span>
              <svg width="132" height="132" viewBox="0 0 132 132">
                <defs>
                  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#4aa8ff"/>
                    <stop offset="1" stop-color="#0058c6"/>
                  </linearGradient>
                </defs>
                <rect x="2" y="2" width="128" height="128" rx="30" fill="url(#g)"/>
                <rect x="2.5" y="2.5" width="127" height="127" rx="29.5" fill="none" stroke="rgba(255,255,255,0.5)"/>
                <g transform="translate(30 30) scale(0.1406)">
                  <path fill="#fff" d="M66.8 243.3C64.4 202.6 63.5 161 66.1 119.9q.9-14.4 3.4-29c1.8-10.5 4.7-23.7 11.6-31.2 7.7-8.5 21.2-.3 28.3 4.8q13.2 9.3 28.1 23.8 16.6 16.1 32.8 31.9 7 6.9 15.4 13.5c3.8 3 9 6.8 14 5.4q56.3-16.1 112.8.1c4.5 1.3 9.8-2.3 13.7-5.4q8.4-6.6 15.6-13.7 16.6-16.1 32-31.1 15.8-15.3 30.1-25.3 5.9-4.1 12.7-6.5c13.5-4.8 19 7.4 22.1 17.6q4.1 13.5 5.8 29.9 3.1 29.3 3.1 64.3-.1 36.6-2.4 74.6l.2 1q13.9 26.9 21.1 57.5c2.4 10.3-.9 22.1-5.5 31.7-11.4 24-30.9 45.2-51.4 62.3q-36.9 30.8-80 46.9-63.5 23.7-127.8 6.3c-39.3-10.7-76.2-32.2-106.5-59.4-17.8-16-34.7-35.3-44.7-57-4.3-9.3-7.5-20.8-5.2-30.6q7.2-30.8 21.1-57.7z"/>
                </g>
              </svg>
              <span class="badge">双击</span>
            </div>
            <span class="appname">DinoVPN</span>
          </div>
        </div>
        <div class="caption">
          <span class="n">02</span>
          <h2>双击应用图标</h2>
          <p>应用会自动复制到「应用程序」<br/>并从新位置重新打开。</p>
        </div>
      </div>

      <div class="arrow">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M6 14h15M15 8l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <!-- 3 -->
      <div class="step">
        <div class="stage">
          <div class="chrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="name">首次打开</span></div>
          <div class="dialog-wrap">
            <div class="dialog">
              <div class="body">
                <svg width="42" height="42" viewBox="0 0 42 42">
                  <circle cx="21" cy="21" r="20" fill="#fff" stroke="#d2d2d7"/>
                  <path d="M21 12v12" stroke="#1d1d1f" stroke-width="2.4" stroke-linecap="round"/>
                  <circle cx="21" cy="29.5" r="1.5" fill="#1d1d1f"/>
                </svg>
                <h3>无法打开“DinoVPN”</h3>
                <p>Apple 无法验证此 App 不包含恶意软件。</p>
              </div>
              <div class="btns">
                <button>移到废纸篓</button>
                <button class="go">仍要打开</button>
              </div>
            </div>
          </div>
        </div>
        <div class="caption">
          <span class="n">03</span>
          <h2>点「仍要打开」</h2>
          <p>首次启动会被系统拦截一次。<br/>点右下角按钮即可继续。</p>
        </div>
      </div>
    </div>

    <footer>
      <span>之后从启动台或「应用程序」文件夹打开即可。</span>
      <span>需要 macOS <b>11</b> 或更高版本</span>
    </footer>
  </div>
</body>
</html>
